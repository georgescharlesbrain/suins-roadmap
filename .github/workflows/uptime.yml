name: Uptime check

on:
  schedule:
    # Every 30 minutes
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check production URL
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 15 https://suins-roadmap.vercel.app)
          echo "HTTP status: $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 400 ]; then
            echo "Site returned $STATUS — marking as failed."
            exit 1
          fi
          echo "Site is up."
