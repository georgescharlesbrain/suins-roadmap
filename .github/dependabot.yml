version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Africa/Nairobi
    open-pull-requests-limit: 5
    ignore:
      # Tailwind v4 is a breaking major version — requires full config rewrite
      - dependency-name: tailwindcss
        versions: [">=4"]
    groups:
      next-react:
        patterns:
          - next
          - react
          - react-dom
          - "@types/react*"
      build-tooling:
        patterns:
          - typescript
          - tailwindcss
          - postcss
          - autoprefixer

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "09:00"
      timezone: Africa/Nairobi
